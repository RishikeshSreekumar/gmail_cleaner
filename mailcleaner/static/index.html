<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mailcleaner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%239e4421'/%3E%3Cg transform='translate%280 2.5%29'%3E%3Cpath d='M48 31v11a3.5 3.5 0 0 1-3.5 3.5h-27A3.5 3.5 0 0 1 14 42V23.5A3.5 3.5 0 0 1 17.5 20H40.5' fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 22.5l10.5 8.75L49.5 13' fill='none' stroke='%23fff' stroke-width='6.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Warm paper, ink-brown text, one terracotta accent and one green that only
     ever means "protected". Deliberately a single light theme.
     Fonts are fetched if the machine is online and fall back cleanly if not.

     Layout rules, kept everywhere: one content column (max 1120px) whose
     blocks all span its full width; 8px spacing steps; every page opens with
     the same header (title, one-line lede, actions on the right); numbers are
     right-aligned and tabular; tables share one grid component. */
  :root {
    --bg:      oklch(0.968 0.009 85);
    --panel:   oklch(0.985 0.006 85);
    --card:    oklch(0.995 0.004 85);
    --raised:  oklch(0.955 0.010 82);
    --white:   oklch(1 0 0);
    --line:    oklch(0.90 0.012 80);
    --line2:   oklch(0.86 0.014 80);
    --hair:    oklch(0.945 0.010 82);
    --ink:     oklch(0.24 0.012 60);
    --ink2:    oklch(0.30 0.012 60);
    --dim:     oklch(0.52 0.012 60);
    --dim2:    oklch(0.60 0.012 60);
    --accent:  oklch(0.50 0.13 40);
    --accent-d:oklch(0.44 0.13 40);
    --accent-l:oklch(0.96 0.03 45);
    --green:   oklch(0.50 0.11 150);
    --green-d: oklch(0.46 0.10 150);
    --green-bg:oklch(0.97 0.02 150);
    --green-ln:oklch(0.86 0.05 150);
    --up:      oklch(0.52 0.14 35);
    --bad:     oklch(0.48 0.15 30);
    --bad-bg:  oklch(0.97 0.02 30);
    --bar:     oklch(0.93 0.022 70);
    --dark:    oklch(0.22 0.012 60);
    --mono: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    --r: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: var(--sans); font-size: 14px; line-height: 1.45; color: var(--ink);
         -webkit-font-smoothing: antialiased; min-height: 100vh; }
  ::selection { background: oklch(0.88 0.05 150); }
  .mono { font-family: var(--mono); }
  .num  { font-variant-numeric: tabular-nums; }
  .r { text-align: right; }
  .dim { color: var(--dim); }
  button { font: inherit; }
  a { color: var(--accent); }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 24px;
    border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 20; }
  /* The wordmark: Geist SemiBold, lowercase, tracked -0.02em - the same
     setting as assets/brand/wordmark.svg. */
  .brand { display: flex; align-items: center; gap: 10px; flex: none; width: 170px;
    color: var(--ink); text-decoration: none; }
  .brand .mark { display: block; flex: none; }
  .brand .name { font-size: 16.5px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }

  .acct { position: relative; flex: none; }
  .acct-btn { display: flex; align-items: center; gap: 9px; max-width: 280px; height: 36px;
    padding: 0 10px 0 7px; font-size: 13px; color: var(--ink);
    background: none; border: 1px solid transparent; border-radius: 9px; cursor: pointer; }
  .acct-btn:hover, .acct-btn[aria-expanded="true"] { background: var(--white);
    border-color: var(--line); }
  .acct-btn .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct-btn .caret { flex: none; color: var(--dim); }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid;
    place-items: center; font-size: 11px; font-weight: 600; color: var(--white);
    background: var(--accent); text-transform: uppercase; }

  .menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 50;
    min-width: 320px; padding: 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 13px;
    box-shadow: 0 12px 34px oklch(0.24 0.012 60 / 0.14); }
  .menu .mrow { display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 9px 10px; text-align: left; background: none;
    border: none; border-radius: 9px; cursor: pointer; color: var(--ink); }
  .menu .mrow:hover { background: var(--raised); }
  .menu .mrow .t { flex: 1; min-width: 0; }
  .menu .mrow .n { font-size: 13.5px; font-weight: 500; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .menu .mrow .s { font-size: 11.5px; color: var(--dim); margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu .mrow .tick { flex: none; color: var(--accent); font-size: 13px; }
  .menu .sep { height: 1px; margin: 6px 4px; background: var(--line); }
  .menu .mrow.add .dot { background: none; border: 1px dashed var(--line2);
    color: var(--dim); font-size: 14px; font-weight: 400; }
  .menu .eyebrow { padding: 8px 10px 6px; margin: 0; }

  #ask { flex: 1 1 360px; max-width: 440px; position: relative; }
  #ask input { width: 100%; height: 36px; padding: 0 12px 0 34px;
    border: 1px solid var(--line2); border-radius: 9px; background: var(--white);
    font-size: 13px; color: var(--ink); outline: none; }
  #ask input:focus { border-color: oklch(0.6 0.06 40); }
  #ask svg { position: absolute; left: 11px; top: 11px; color: var(--dim2); }
  .spacer { flex: 1; }

  .mode { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
    border: 1px solid var(--line2); border-radius: 999px; background: var(--white);
    font-size: 12.5px; color: var(--ink2); cursor: pointer; white-space: nowrap; flex: none; }
  .mode i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim2); }
  .mode.on { border-color: oklch(0.82 0.06 45); background: var(--accent-l); color: var(--accent-d); }
  .mode.on i { background: var(--accent); }
  .syncbox { display: flex; align-items: center; gap: 10px; flex: none; }
  #synced { font-size: 12.5px; color: var(--dim); white-space: nowrap; }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border: 1px solid var(--line2); background: var(--white);
    border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--ink2);
    cursor: pointer; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: oklch(0.7 0.02 80); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { border-color: var(--accent); background: var(--accent); color: oklch(0.99 0.005 85); }
  .btn.primary:hover:not(:disabled) { background: var(--accent-d); border-color: var(--accent-d); }
  .btn.danger { border-color: var(--bad); background: var(--bad); color: var(--white); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
  .btn.big { height: 40px; padding: 0 18px; font-size: 14px; }
  .btn.link { height: auto; padding: 0; border: none; background: none; color: var(--accent); }
  .btn.link:hover { text-decoration: underline; }
  .btn.quiet { border-color: transparent; background: none; color: var(--dim); font-weight: 400; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- shell ---------- */
  .shell { display: flex; align-items: flex-start; }
  nav { width: 218px; flex: none; padding: 20px 12px 24px 24px; position: sticky; top: 60px;
    max-height: calc(100vh - 60px); overflow-y: auto; }
  nav .group { margin-bottom: 18px; }
  nav .gl { padding: 0 10px 6px; font-size: 11px; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--dim2); }
  nav button { display: flex; align-items: center; justify-content: space-between; width: 100%;
    height: 32px; padding: 0 10px; border: none; border-radius: 7px; cursor: pointer;
    background: none; color: oklch(0.36 0.012 60); font-size: 13.5px; text-align: left; }
  nav button:hover { background: oklch(0.945 0.012 80); }
  nav button.on { font-weight: 500; background: oklch(0.92 0.02 60); color: var(--dark); }
  nav .count { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  nav .note { margin-top: 6px; padding: 12px 10px 0; border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.55; color: var(--dim2); }
  nav .note .row { display: flex; align-items: center; gap: 7px; color: var(--green-d); }
  .swatch { width: 7px; height: 7px; border-radius: 2px; background: var(--green);
    display: inline-block; flex: none; }
  main { flex: 1; min-width: 0; max-width: 1120px; padding: 28px 32px 140px 16px; }

  /* ---------- page structure ---------- */
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 24px; flex-wrap: wrap; }
  .pagehead h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
  .lede { margin: 6px 0 0; max-width: 640px; font-size: 13.5px; color: var(--dim); }
  section { margin-top: 36px; }
  .sechead { display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 12px; }
  .sechead h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .sechead p { margin: 3px 0 0; font-size: 13px; color: var(--dim); }
  .eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim2); margin-bottom: 6px; }
  .card { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
  .note-box { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel); font-size: 13px; line-height: 1.6; color: var(--ink2); }
  .notice { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; margin-top: 16px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--panel); font-size: 13px; color: var(--ink2); flex-wrap: wrap; }
  code { background: oklch(0.945 0.012 82); padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  pre.code { margin: 0; padding: 12px 14px; overflow-x: auto; background: var(--raised);
    border: 1px solid var(--line); border-radius: 8px; font-family: var(--mono);
    font-size: 12px; line-height: 1.55; }
  .err { color: var(--bad); }
  .loading { padding: 40px 0; color: var(--dim); font-size: 13px; }

  /* ---------- overview ---------- */
  .hero { display: grid; grid-template-columns: 1fr 1px 1fr auto; align-items: end;
    gap: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .figure { font-size: 40px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  .under { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .vrule { align-self: stretch; background: var(--line); }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .tile { padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--card); text-align: left; cursor: pointer; color: var(--ink); }
  .tile:hover { border-color: oklch(0.78 0.02 80); }
  .tile .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .tile .k { font-size: 12.5px; color: var(--dim); margin-top: 2px; }
  .stack { display: flex; height: 36px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); }
  .stack div { display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-family: var(--mono); color: oklch(0.3 0.02 70); overflow: hidden; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; }
  .legend .item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .legend .key { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legend .val { font-family: var(--mono); font-size: 12px; color: var(--dim); }

  /* ---------- tables ---------- */
  .tbl { border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto;
    background: var(--card); }
  .tbl .head, .tbl .row { display: grid; align-items: center; column-gap: 16px;
    padding: 0 16px; min-width: 680px; }
  .tbl .head { height: 36px; background: var(--raised); border-bottom: 1px solid var(--line);
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--dim); }
  .tbl .row { min-height: 42px; border-bottom: 1px solid var(--hair); font-size: 13px; }
  .tbl .row.click { cursor: pointer; }
  .tbl .row:last-child { border-bottom: 0; }
  .tbl .row.click:hover { background: oklch(0.965 0.014 82); }
  .tbl .row.on { background: oklch(0.965 0.022 55); }
  .tbl .cell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl .c { text-align: center; }
  .tbl .wrap { white-space: normal; padding: 8px 0; line-height: 1.4; }
  .tbl .empty { padding: 28px 16px; font-size: 13px; color: var(--dim); }
  .cellsender { position: relative; }
  .cellsender .bar { position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    height: 20px; background: var(--bar); border-radius: 3px; }
  .cellsender .txt { position: relative; font-family: var(--mono); font-size: 12.5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 6px; }
  .box { width: 16px; height: 16px; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font-size: 10px; cursor: pointer;
    background: var(--white); border: 1px solid oklch(0.8 0.014 80); color: transparent; }
  .box.on { background: var(--accent); border-color: var(--accent); color: oklch(0.99 0.005 85); }
  .prot0 { color: var(--dim2); }
  .prot1 { color: var(--green-d); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
    border-radius: 999px; font-size: 11.5px; border: 1px solid var(--line2);
    color: var(--dim); background: var(--white); white-space: nowrap; }
  .pill.accent { border-color: oklch(0.82 0.06 45); color: var(--accent-d); background: var(--accent-l); }
  .pill.ok { border-color: var(--green-ln); color: var(--green-d); background: var(--green-bg); }
  .pill.bad { border-color: oklch(0.85 0.06 30); color: var(--bad); background: var(--bad-bg); }

  /* ---------- toolbars ---------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input { width: 260px; height: 34px; padding: 0 12px; border: 1px solid var(--line2);
    border-radius: 8px; background: var(--white); font-size: 13px; color: var(--ink); outline: none; }
  .toolbar input:focus { border-color: oklch(0.6 0.06 40); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 34px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 8px;
    font-size: 13px; cursor: pointer; background: var(--white); color: var(--ink2); }
  .chip.on { border-color: var(--accent); font-weight: 500; background: var(--accent-l);
    color: var(--accent-d); }
  .count-label { font-size: 12.5px; color: var(--dim); }

  /* ---------- cleanup ---------- */
  .batches { display: flex; flex-direction: column; gap: 10px; }
  .batch { display: grid; grid-template-columns: 1fr 100px 100px 130px; align-items: center;
    gap: 20px; padding: 16px 20px; border: 1px solid var(--line); border-radius: var(--r);
    background: var(--card); }
  .batch:hover { border-color: oklch(0.78 0.02 80); }
  .batch .title { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
  .batch .detail { font-size: 13px; color: var(--dim); }
  .batch .big { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; text-align: right; }
  .batch .cap { font-size: 12px; color: var(--dim2); text-align: right; }
  .safe { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding: 14px 18px;
    border: 1px solid var(--green-ln); border-radius: var(--r); background: var(--green-bg);
    font-size: 13px; color: oklch(0.32 0.03 150); }

  /* ---------- settings ---------- */
  .settings { border-top: 1px solid var(--line); }
  .setrow { display: grid; grid-template-columns: 260px 1fr; gap: 40px;
    padding: 28px 0; border-bottom: 1px solid var(--line); }
  .setrow h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .setrow .about { font-size: 13px; color: var(--dim); line-height: 1.55; }
  .setrow .scope { margin-top: 8px; }
  .stack-v { display: flex; flex-direction: column; gap: 16px; max-width: 560px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > span { font-size: 12px; font-weight: 500; color: var(--ink2); }
  .field small { font-size: 12px; color: var(--dim); }
  .field input, .field select, .form input, .form select {
    width: 100%; height: 36px; padding: 0 12px; font-size: 13.5px;
    border: 1px solid var(--line2); border-radius: 8px; background: var(--white); color: var(--ink); }
  .field input:focus, .field select:focus, .form input:focus, .form select:focus {
    outline: none; border-color: var(--accent); }
  .inline { display: flex; gap: 8px; align-items: center; }
  .inline > .grow { flex: 1; min-width: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; cursor: pointer; }
  .check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--accent); flex: none; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; font-size: 13px; }
  .kv dt { color: var(--dim); }
  .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .choice { padding: 12px 14px; border: 1px solid var(--line2); border-radius: var(--r);
    background: var(--white); text-align: left; cursor: pointer; color: var(--ink); }
  .choice:hover { border-color: oklch(0.7 0.02 80); }
  .choice.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset;
    background: var(--accent-l); }
  .choice b { display: block; font-size: 13.5px; font-weight: 600; }
  .choice span { display: block; margin-top: 3px; font-size: 12px; color: var(--dim); line-height: 1.4; }
  .checks { display: flex; flex-direction: column; border: 1px solid var(--line);
    border-radius: var(--r); background: var(--card); }
  .checks .ck { display: grid; grid-template-columns: 22px 170px 1fr; gap: 10px; align-items: baseline;
    padding: 9px 14px; border-bottom: 1px solid var(--hair); font-size: 13px; }
  .checks .ck:last-child { border-bottom: 0; }
  .checks .fix { grid-column: 3; color: var(--up); font-size: 12.5px; }
  .ok-mark { color: var(--green-d); } .bad-mark { color: var(--bad); } .skip-mark { color: var(--dim2); }
  .danger-zone { border-color: oklch(0.86 0.05 30); }

  /* ---------- selection bar ---------- */
  #selbar { position: fixed; bottom: 20px; left: 0; right: 0; display: flex;
    justify-content: center; pointer-events: none; z-index: 30; }
  #selbar .inner { display: flex; align-items: center; gap: 16px;
    padding: 10px 12px 10px 18px; background: var(--dark); border-radius: 12px;
    box-shadow: 0 8px 28px oklch(0.24 0.012 60 / 0.28); pointer-events: auto;
    max-width: calc(100vw - 32px); flex-wrap: wrap; }
  #selbar .label { font-size: 13px; color: oklch(0.95 0.006 85); white-space: nowrap; }
  #selbar .clear { background: none; border: none; padding: 0; font-size: 13px;
    color: oklch(0.72 0.012 60); cursor: pointer; }
  #selbar .acts { display: flex; gap: 8px; }
  #selbar .acts button { height: 32px; padding: 0 14px; border: 1px solid oklch(0.38 0.012 60);
    background: none; border-radius: 8px; font-size: 13px; color: oklch(0.95 0.006 85); cursor: pointer; }
  #selbar .acts button:hover { background: oklch(0.28 0.012 60); }
  #selbar .acts button.danger { border: none; font-weight: 500;
    background: oklch(0.58 0.15 40); color: oklch(0.99 0.005 85); }

  /* ---------- sheets (modals) ---------- */
  #scrim { position: fixed; inset: 0; background: oklch(0.24 0.012 60 / 0.4); z-index: 40;
    display: flex; align-items: center; justify-content: center; padding: 32px; }
  .sheet { width: 820px; max-width: 100%; max-height: 100%; display: flex;
    flex-direction: column; background: oklch(0.99 0.005 85); border-radius: 14px;
    box-shadow: 0 24px 60px oklch(0.24 0.012 60 / 0.3); overflow: hidden; }
  .sheet.narrow { width: 540px; }
  .sheet .top { padding: 20px 24px 18px; border-bottom: 1px solid var(--line); }

<script>
/* ---------- transport ---------- */
const TOKEN = (() => {
  const u = new URL(location.href);
  const t = u.searchParams.get('t');
  if (t) { sessionStorage.setItem('gc-token', t);
           history.replaceState({}, '', u.pathname); }
  return t || sessionStorage.getItem('gc-token') || '';
})();

async function api(path, body) {
  const res = await fetch('/api/' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ error: 'bad response' }));
  if (!res.ok || data.error) throw new Error(data.error || res.statusText);
  return data;
}

/* Downloads go through fetch so the token stays in a header, not a URL. */
async function download(query) {
  const res = await fetch('/api/export?' + new URLSearchParams(query),
                          { headers: { 'X-Token': TOKEN } });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    return toast(d.error || 'Export failed', true);
  }
  const name = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
  const url = URL.createObjectURL(await res.blob());
  const a = el('a', { href: url, download: name ? name[1] : 'export.csv' });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
function el(tag, props = {}, kids = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'style' && typeof v === 'string') n.setAttribute('style', v);
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else n[k] = v;
  }
  for (const c of [].concat(kids)) if (c != null && c !== false) n.append(c);
  return n;
}
const num = (n) => (n || 0).toLocaleString();
function size(n) {
  n = n || 0;
  for (const u of ['B', 'KB', 'MB', 'GB', 'TB']) {
    if (n < 1024) return u === 'B' ? `${n | 0} B` : `${n.toFixed(1)} ${u}`;
    n /= 1024;
  }
  return `${n.toFixed(1)} PB`;
}
function ago(ts) {
  if (!ts) return '—';
  const d = (Date.now() / 1000 - ts) / 86400;
  if (d < 1 / 24) return 'just now';
  if (d < 1) return `${Math.max(1, (d * 24) | 0)}h ago`;
  if (d < 2) return 'yesterday';
  if (d < 30) return `${d | 0}d ago`;
  if (d < 365) return `${(d / 30) | 0}mo ago`;
  return `${(d / 365).toFixed(1)}y ago`;
}
const when = (ts) => (ts ? new Date(ts * 1000).toLocaleString() : '—');
const plural = (n, w) => `${num(n)} ${w}${n === 1 ? '' : 's'}`;

let toastTimer;
function toast(msg, bad, action) {
  const t = $('#toast');
  t.textContent = '';
  t.append(el('span', { textContent: msg }));
  if (action) t.append(el('button', { textContent: action.label,
    onclick: () => { t.style.display = 'none'; action.run(); } }));
  t.className = bad ? 'bad' : '';
  t.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.display = 'none'), action ? 9000 : 5000);
}

/* Every page opens with the same header. */
function pageHead(title, lede, actions) {
  return el('div', { className: 'pagehead' }, [
    el('div', {}, [el('h1', { textContent: title }),
                   lede ? el('p', { className: 'lede', textContent: lede }) : null]),
    actions ? el('div', { className: 'btns' }, actions) : null,
  ]);
}
function secHead(title, sub, actions) {
  return el('div', { className: 'sechead' }, [
    el('div', {}, [el('h2', { textContent: title }),
                   sub ? el('p', { textContent: sub }) : null]),
    actions ? el('div', { className: 'btns' }, actions) : null,
  ]);
}
function button(label, run, cls = '') {
  return el('button', { className: 'btn ' + cls, textContent: label, onclick: run });
}

/* ---------- state ---------- */
const S = {
  tab: 'overview',
  actions: false,
  selected: new Set(),
  query: '',
  filter: 'All',
  senders: [],
  overview: null,
  activeAccount: '',
  accounts: [],
  needsSetup: false,
};

const DOMAIN_COLORS = [
  'oklch(0.78 0.075 45)', 'oklch(0.84 0.055 55)', 'oklch(0.87 0.045 90)',
  'oklch(0.85 0.05 130)', 'oklch(0.87 0.04 160)', 'oklch(0.89 0.03 190)',
];
const OTHER_COLOR = 'oklch(0.93 0.012 82)';
const TREND = {
  up:   { label: '↑ rising',  color: 'var(--up)' },
  new:  { label: '↑ new',     color: 'var(--up)' },
  down: { label: '↓ falling', color: 'var(--green)' },
  flat: { label: '→ flat',    color: 'var(--dim2)' },
  '-':  { label: 'dormant',   color: 'var(--dim2)' },
};

/* Bulk actions the server will actually accept. There is no permanent delete
   anywhere in this tool; trash is the provider's own, and reversible.
   Unsubscribing is separate: it touches no mail, and has its own view. */
const ACTIONS = [
  { id: 'mark_read', label: 'Mark read' },
  { id: 'archive',   label: 'Archive' },
  { id: 'trash',     label: 'Trash', danger: true,
    title: 'Moves to your provider\'s Trash — recoverable there, and undoable from History' },
];

function needActions() {
  toast('This mailbox is read-only. Turn on actions to make changes.', false,
        { label: 'Settings', run: () => go('settings', { anchor: 'set-actions' }) });
}

/* ---------- generic table ----------
   cols: { label, w, r (right-align), key | fmt(row) -> text | node(row) -> Element } */
function table(cols, rows, { onClick, empty = 'Nothing here.', rowClass } = {}) {
  const grid = cols.map((c) => c.w || '1fr').join(' ');
  const wrap = el('div', { className: 'tbl' });
  wrap.append(el('div', { className: 'head', style: `grid-template-columns:${grid}` },
    cols.map((c) => el('div', { className: 'cell' + (c.r ? ' r' : c.c ? ' c' : ''),
                                textContent: c.label }))));
  for (const r of rows) {
    const row = el('div', { className: 'row' + (onClick ? ' click' : '') +
                                       (rowClass ? ' ' + rowClass(r) : ''),
                            style: `grid-template-columns:${grid}` });
    if (onClick) row.onclick = () => onClick(r);
    for (const c of cols) {
      const cell = el('div', { className: 'cell' + (c.r ? ' r num' : c.c ? ' c' : '') +
                                          (c.cls ? ' ' + c.cls(r) : '') + (c.wrap ? ' wrap' : '') });
      if (c.node) cell.append(c.node(r));
      else cell.textContent = c.fmt ? c.fmt(r) : (r[c.key] ?? '');
      if (c.title) cell.title = c.title(r);
      row.append(cell);
    }
    wrap.append(row);
  }
  if (!rows.length) wrap.append(el('div', { className: 'empty', textContent: empty }));
  return wrap;
}
const stop = (fn) => (e) => { e.stopPropagation(); fn(); };

/* ---------- sender table (with volume bars and selection) ---------- */
function senderTable(rows, { selectable = false, max = 0 } = {}) {
  const peak = max || Math.max(1, ...rows.map((r) => r.emails || 0));
  const cols = [];
  if (selectable) cols.push({ label: '', w: '20px', node: (r) => {
    const b = el('span', { className: 'box' + (S.selected.has(r.key) ? ' on' : ''), textContent: '✓' });
    b.onclick = stop(() => toggle(r.key));
    return b;
  } });
  cols.push(
    { label: 'Sender', w: 'minmax(220px,1fr)', node: (r) => el('div', { className: 'cellsender' }, [
      el('div', { className: 'bar', style: `width:${Math.max(3, (r.emails || 0) / peak * 100)}%` }),
      el('div', { className: 'txt', textContent: r.key || '(unknown)' }),
    ]) },
    { label: 'Emails', w: '72px', r: true, fmt: (r) => num(r.emails) },
    { label: 'Unread', w: '72px', r: true, fmt: (r) => num(r.unread) },
    { label: '/ week', w: '64px', r: true, fmt: (r) => (r.per_week || 0).toFixed(1) },
    { label: 'Trend', w: '84px', node: (r) => {
      const t = TREND[r.trend] || TREND.flat;
      return el('span', { style: `font-size:12.5px; color:${t.color}`, textContent: t.label });
    } },
    { label: 'Size', w: '80px', r: true, fmt: (r) => size(r.bytes) },
    { label: 'Last', w: '84px', r: true, fmt: (r) => ago(r.last_seen) },
    { label: 'Protected', w: '84px', r: true, fmt: (r) => (r.protected ? num(r.protected) : '—'),
      cls: (r) => (r.protected ? 'prot1' : 'prot0') },
  );
  return table(cols, rows, { onClick: (r) => openSender(r.key),
    rowClass: (r) => (S.selected.has(r.key) ? 'on' : '') });
}

function toggle(key) {
  if (!S.actions) return needActions();
  S.selected.has(key) ? S.selected.delete(key) : S.selected.add(key);
  go(S.tab);
}

/* ---------- selection bar ---------- */
function drawSelectionBar() {
  const old = $('#selbar');
  if (old) old.remove();
  if (!S.selected.size || !S.actions) return;
  const chosen = S.senders.filter((s) => S.selected.has(s.key));
  const affected = chosen.reduce((a, s) => a + (s.emails - (s.protected || 0)), 0);
  const target = { kind: 'senders', value: [...S.selected] };
  document.body.append(el('div', { id: 'selbar' }, el('div', { className: 'inner' }, [
    el('span', { className: 'label num', textContent:
      `${plural(S.selected.size, 'sender')} · ${num(affected)} messages affected` }),
    el('button', { className: 'clear', textContent: 'Clear',
      onclick: () => { S.selected.clear(); go(S.tab); } }),
    el('div', { className: 'acts' }, ACTIONS.map((a) => el('button', {
      className: a.danger ? 'danger' : '', textContent: a.label, title: a.title || '',
      onclick: () => openPreview(target, a.id) }))),
  ])));
}

/* ---------- sheets ---------- */
function openSheet(build, cls = '') {
  closeSheet();
  const sheet = el('div', { className: 'sheet ' + cls });
  sheet.onclick = (e) => e.stopPropagation();
  $('#mount').append(el('div', { id: 'scrim', onclick: closeSheet }, sheet));
  document.addEventListener('keydown', escClose);
  build(sheet);
  return sheet;
}
function closeSheet() {
  const s = $('#scrim');
  if (s) s.remove();
  document.removeEventListener('keydown', escClose);
}
function escClose(e) { if (e.key === 'Escape') closeSheet(); }

function sheetTop(eyebrow, title, { mono = false, sub = '' } = {}) {
  return el('div', { className: 'top' }, el('div', { className: 'toprow' }, [
    el('div', {}, [
      eyebrow ? el('div', { className: 'eyebrow', textContent: eyebrow }) : null,
      el('div', { className: 'title' + (mono ? ' mono' : ''), textContent: title }),
      sub ? el('div', { className: 'sub', textContent: sub }) : null,
    ]),
    el('button', { className: 'x', textContent: '✕', 'aria-label': 'Close', onclick: closeSheet }),
  ]));
}
function sheetError(sheet, message) {
  sheet.textContent = '';
  sheet.append(el('div', { className: 'body' }, el('p', { className: 'err', textContent: message })));
  sheet.append(el('div', { className: 'foot' }, [el('span', { className: 'msg' }),
    button('Close', closeSheet, 'quiet')]));
}
function statRow(items) {
  return el('div', { className: 'stats' }, items.map(([v, k, st]) => el('div', {}, [
    el('div', { className: 'v num', style: st || '', textContent: v }),
    el('div', { className: 'k', textContent: k }),
  ])));
}
function catBars(cats) {
  const peak = Math.max(1, ...cats.map((c) => c.emails));
  return el('div', {}, cats.slice(0, 8).map((c) => el('div', { className: 'catrow' }, [
    el('div', { textContent: c.key || '(none)' }),
    el('div', { className: 'track' }, el('div', { className: 'fill',
      style: `width:${(c.emails / peak * 100).toFixed(1)}%; background:` +
             (c.protected === c.emails ? 'oklch(0.78 0.06 150)' : 'oklch(0.82 0.07 55)') })),
    el('div', { className: 'c num', textContent: num(c.emails) }),
    el('div', { className: 'p ' + (c.protected ? 'prot1' : 'prot0'),
      textContent: c.protected ? `${num(c.protected)} protected` : 'none protected' }),
  ])));
}

/* A confirmation that lives in the page, never a browser dialog. */
function confirmSheet({ title, body, confirm, danger = false, run }) {
  openSheet((sheet) => {
    sheet.append(sheetTop('', title));
    sheet.append(el('div', { className: 'body' }, [].concat(body).map((t) =>
      typeof t === 'string' ? el('p', { style: 'margin:0 0 10px', textContent: t }) : t)));
    const msg = el('span', { className: 'msg' });
    const ok = el('button', { className: 'btn ' + (danger ? 'danger' : 'primary'), textContent: confirm });
    ok.onclick = async () => {
      ok.disabled = true;
      try { await run(); closeSheet(); }
      catch (e) { msg.textContent = e.message; msg.className = 'msg err'; ok.disabled = false; }
    };
    sheet.append(el('div', { className: 'foot' }, [msg, button('Cancel', closeSheet, 'quiet'), ok]));
  }, 'narrow');
}

/* ---------- sender detail ---------- */
async function openSender(email) {
  const sheet = openSheet((s) => s.append(el('div', { className: 'body loading', textContent: 'Loading…' })));
  let d;
  try { d = await api('sender?value=' + encodeURIComponent(email)); }
  catch (e) { return sheetError(sheet, e.message); }
  const r = d.row;
  const eligible = r.emails - (r.protected || 0);
  sheet.textContent = '';
  const top = sheetTop('Sender', r.key, { mono: true });
  top.append(statRow([[num(r.emails), 'messages'], [size(r.bytes), 'total size'],
    [(r.per_week || 0).toFixed(1), 'per week'],
    [num(r.protected), 'protected · excluded', 'color:var(--green-d)']]));
  sheet.append(top);

  const body = el('div', { className: 'body' });
  body.append(el('h3', { textContent: 'What it sends' }));
  body.append(d.categories.length ? catBars(d.categories)
    : el('p', { className: 'dim', textContent: 'No mail.' }));
  body.append(el('h3', { textContent: 'Recent subjects' }));
  body.append(el('div', { className: 'subjects' }, (d.samples || []).map((m) =>
    el('div', { className: 's' }, [
      el('div', { className: 't', textContent: m.subject || '(no subject)' }),
      el('div', { className: 'w num', textContent: ago(m.received_at) }),
    ]))));

  const addRule = async (action) => {
    try {
      await api('rules/simple/add', { match_type: 'sender', value: r.key, action });
      toast(`${action === 'protect' ? 'Protected' : 'Ignoring'} ${r.key}.`);
      S.overview = null;
      await refreshHeader();
      openSender(r.key);
    } catch (e) { toast(e.message, true); }
  };
  body.append(el('h3', { textContent: 'Rules' }));
  body.append(el('div', { className: 'btns' }, [
    el('button', { className: 'btn', textContent: 'Always protect',
      title: 'Never include this sender in a bulk action', onclick: () => addRule('protect') }),
    el('button', { className: 'btn', textContent: 'Treat as clutter',
      title: 'Everything from them becomes a cleanup candidate', onclick: () => addRule('ignore') }),
    d.unsubscribe ? el('button', { className: 'btn', textContent: 'Unsubscribe…',
      onclick: () => openUnsub(r.key, d.unsubscribe) }) : null,
  ]));
  sheet.append(body);

  const target = { kind: 'sender', value: r.key };
  const foot = el('div', { className: 'foot' });

    foot.append(button('Archive', () => openPreview(target, 'archive')));

/* ---------- preview + confirm ---------- */
async function openPreview(target, preferred, opts = {}) {
  const sheet = openSheet((s) => s.append(el('div', { className: 'body loading', textContent: 'Loading preview…' })));
  let info;
  try { info = await api('preview', { target }); }
  catch (e) { return sheetError(sheet, e.message); }
  sheet.textContent = '';
  const top = sheetTop('Selection', info.title);
  top.append(statRow([[num(info.eligible), 'would be affected'], [size(info.bytes), 'total size'],
    [num(info.protected), 'protected · excluded', 'color:var(--green-d)'],
    [info.oldest ? `${ago(info.newest).replace(' ago', '')} – ${ago(info.oldest)}` : '—', 'age range']]));
  sheet.append(top);

  const body = el('div', { className: 'body' });
  if (opts.note) body.append(el('div', { className: 'note-box', style: 'margin-bottom:20px',
    textContent: opts.note }));
  if ((info.categories || []).length) {
    body.append(el('h3', { textContent: 'What is in the selection' }));
    body.append(catBars(info.categories));
  }
  body.append(el('h3', { textContent: 'Examples' }));
  const samples = (info.samples || []).slice(0, 6);
  body.append(samples.length ? el('div', { className: 'subjects' }, samples.map((m) =>
    el('div', { className: 's' }, [
      el('div', { className: 't', textContent: `${m.from_email} — ${m.subject || '(no subject)'}` }),
      el('div', { className: 'w num', textContent: ago(m.received_at) }),
    ]))) : el('p', { className: 'dim', textContent: 'Nothing eligible.' }));
  sheet.append(body);

  const foot = el('div', { className: 'foot' });
  if (opts.saveFilter) foot.append(button('Save as rule', () => openRuleForm(opts.saveFilter), 'quiet'));
  if (!S.actions) {
    foot.append(el('span', { className: 'msg', textContent: 'Read-only. Nothing will be changed.' }));
    foot.append(button('Turn on actions', () => { closeSheet(); go('settings', { anchor: 'set-actions' }); }));
  } else if (!info.eligible) {
    foot.append(el('span', { className: 'msg', textContent: 'Nothing eligible — everything here is protected.' }));
  } else {
    foot.append(el('span', { className: 'msg', textContent: 'Reversible from History.' }));
    const run = async (action) => {
      foot.querySelectorAll('button').forEach((b) => (b.disabled = true));
      try {
        const res = await api('action', { action, target });
        toast(`${action.replace('_', ' ')}: ${num(res.count)} messages` +
              (res.skipped ? `, ${num(res.skipped)} protected skipped` : '') + '.',
              false, res.batch_id ? { label: 'Undo', run: () => undo(res.batch_id) } : null);
        closeSheet();
        S.selected.clear();
        S.overview = null;
        await refreshHeader();
        go(S.tab);
      } catch (e) {
        toast(e.message, true);
        foot.querySelectorAll('button').forEach((b) => (b.disabled = false));
      }
    };
    foot.append(button('Label for review', () => run('label')));
    for (const a of ACTIONS) {
      const b = button(a.id === preferred ? `${a.label} ${num(info.eligible)}` : a.label,
                       () => run(a.id), a.id === preferred ? 'primary' : '');
      b.title = a.title || '';
      foot.append(b);
    }
  }
  foot.append(button('Close', closeSheet, 'quiet'));
  sheet.append(foot);
}

async function undo(batchId) {
  try {
    const res = await api('undo', { batch_id: batchId });
    toast(`Restored ${num(res.undone)} messages.`);
    S.overview = null;
    await refreshHeader();
    go(S.tab);
  } catch (e) { toast(e.message, true); }
}

  openSheet((sheet) => {
    sheet.append(sheetTop('New rule', 'When… then…'));
    const name = el('input', { type: 'text', placeholder: 'e.g. Old newsletters' });
    const cat = el('select', {}, CATEGORY_CHOICES.map((c) => el('option', { value: c,
      textContent: c || 'Any category', selected: [].concat(prefill.category || [])[0] === c })));
    const sender = el('input', { type: 'text', placeholder: 'Anyone', value: [].concat(prefill.sender || []).join(', ') });
    const domain = el('input', { type: 'text', placeholder: 'Any domain', value: [].concat(prefill.domain || []).join(', ') });
    const subject = el('input', { type: 'text', placeholder: 'Anything', value: prefill.subject_contains || '' });
    const older = el('input', { type: 'number', min: '0', placeholder: 'Any age', value: prefill.older_than_days ?? '' });
    const tri = (v) => el('select', {}, [['', 'Either'], ['true', 'Yes'], ['false', 'No']].map(([val, t]) =>
      el('option', { value: val, textContent: t, selected: v === undefined ? val === '' : String(v) === val })));
    const unread = tri(prefill.unread);
    const inbox = tri(prefill.in_inbox);
    const action = el('select', {}, [['archive', 'Archive'], ['mark_read', 'Mark read'],
      ['label', 'Label / file into'], ['star', 'Star']].map(([v, t]) => el('option', { value: v, textContent: t })));

      f('Name', name),
      el('h3', { textContent: 'When', style: 'margin:8px 0 0' }),
      el('div', { className: 'row2' }, [f('Category', cat), f('Older than (days)', older)]),
      el('div', { className: 'row2' }, [f('Sender(s)', sender), f('Domain(s)', domain)]),
      f('Subject contains', subject),
      el('div', { className: 'row2' }, [f('Unread', unread), f('In inbox', inbox)]),
      el('h3', { textContent: 'Then', style: 'margin:8px 0 0' }),
      el('div', { className: 'row2' }, [f('Action', action), f('Label', label)]),
      el('label', { className: 'check' }, [auto,
        el('span', { textContent: 'Auto — also run it when rules are applied or on the background schedule.' })]),
    ])));
    const msg = el('span', { className: 'msg' });
    const save = button('Save rule', async () => {
      const list = (x) => x.value.split(',').map((v) => v.trim()).filter(Boolean);
      const cond = {};
      if (cat.value) cond.category = [cat.value];
      if (list(sender).length) cond.sender = list(sender);
      if (list(domain).length) cond.domain = list(domain);
      if (subject.value.trim()) cond.subject_contains = subject.value.trim();
      if (older.value !== '') cond.older_than_days = Number(older.value);
      if (unread.value) cond.unread = unread.value === 'true';
      if (inbox.value) cond.in_inbox = inbox.value === 'true';
      for (const k of ['newer_than_days', 'larger_than_kb', 'list_id', 'attention', 'retention',
                       'starred', 'has_attachment', 'has_unsubscribe', 'protected']) {
        if (prefill[k] !== undefined) cond[k] = prefill[k];
      }
      save.disabled = true;
      try {
        await api('rules/add', { name: name.value, conditions: cond, action: action.value,
                                 label: label.value, auto: auto.checked });

        toast('Rule saved.');
        go('rules');
      } catch (e) { msg.textContent = e.message; msg.className = 'msg err'; save.disabled = false; }
    }, 'primary');
    sheet.append(el('div', { className: 'foot' }, [msg, button('Cancel', closeSheet, 'quiet'), save]));
    name.focus();
  }, 'narrow');
}

function openUnsub(sender, opt) {
  const how = {
    'one-click': 'A single unsubscribe request (RFC 8058) is sent from this computer.',
    link: 'The sender’s unsubscribe page opens in a new tab; finish there.',
    mailto: 'An unsubscribe email opens in your mail app; send it from there.',
  }[opt.method] || '';
  openSheet((sheet) => {
    sheet.append(sheetTop('Unsubscribe', sender, { mono: true }));
    sheet.append(el('div', { className: 'body' }, [
      el('p', { style: 'margin:0 0 10px', textContent: how }),
      el('p', { className: 'dim', style: 'margin:0', textContent:
        'It cannot be undone from here. Only do it for lists you signed up for — unsubscribing ' +
        'from spam tells the sender your address is real.' }),
    ]));
    const msg = el('span', { className: 'msg' });
    const run = async (thenArchive) => {
      if (!S.actions) return needActions();
      sheet.querySelectorAll('.foot button').forEach((b) => (b.disabled = true));
      try {
        const r = await api('unsubscribe', { sender });
        if (r.status === 'manual' && r.open) window.open(r.open, '_blank', 'noopener');
        toast(r.status === 'ok' ? `Unsubscribed from ${sender}.` : 'Opened — finish there.');
        if (thenArchive) openPreview({ kind: 'sender', value: sender }, 'archive');
        else { closeSheet(); if (S.tab === 'unsubscribe') go('unsubscribe'); }
      } catch (e) {
        msg.textContent = e.message; msg.className = 'msg err';
        sheet.querySelectorAll('.foot button').forEach((b) => (b.disabled = false));
      }
    };
    sheet.append(el('div', { className: 'foot' }, [msg, button('Cancel', closeSheet, 'quiet'),
      button('Unsubscribe', () => run(false)),
      button('Unsubscribe & archive', () => run(true), 'primary')]));
  }, 'narrow');
}

/* ---------- assistant (LLM suggestions) ---------- */
VIEWS.assistant = async (main) => {
  const d = await api('llm');
  if (d.provider === 'off') {
    main.append(pageHead('Assistant', 'Optional. Proposes rules for senders the classifier is unsure about.'));
    main.append(el('div', { className: 'note-box' }, [
      el('p', { style: 'margin:0 0 12px', textContent:
        'When it is on, the assistant looks at senders the classifier is unsure about — or loud ones ' +
        'nothing protects — and proposes to protect them, treat them as clutter, or recategorise ' +
        'them. You accept or reject each one. It never changes mail, and it can only add protection, ' +
        'never remove it. Run it on your own computer with Ollama, or use Claude.' }),
      button('Set up the assistant', () => go('settings', { anchor: 'set-llm' }), 'primary'),
    ]));
    return;
  }
  const status = el('span', { className: 'count-label', textContent: d.job.running ? d.job.message : '' });
  const ask = button('Ask about more senders', async () => {
    ask.disabled = true;
    try { await api('llm/suggest', { limit: 40 }); pollLLM(status); }
    catch (e) { toast(e.message, true); ask.disabled = false; }
  }, 'primary');
  ask.disabled = d.job.running;
  main.append(pageHead('Assistant',
    `${d.provider === 'ollama' ? 'Ollama' : 'Claude'} · ${d.model}. ` +
    (d.share_subjects ? 'Sender statistics and a few recent subjects are shared with the model. '
                      : 'Only sender statistics are shared with the model. ') +
    'Accepting a suggestion makes it a rule; nothing else changes.',
    [status, button('Settings', () => go('settings', { anchor: 'set-llm' })), ask]));
  if (d.job.running) pollLLM(status);

  const decide = async (r, accept) => {
    try {
      await api('llm/decide', { id: r.id, accept });
      toast(`${accept ? 'Accepted' : 'Rejected'}: ${r.action === 'ignore' ? 'clutter' : r.action} ${r.match_value}`);
      S.overview = null;
      go('assistant');
    } catch (e) { toast(e.message, true); }
  };
  main.append(table([
    { label: 'Sender', w: 'minmax(200px,1fr)', node: (r) => el('span', { className: 'mono',
      style: 'font-size:12.5px', textContent: r.match_value }) },
    { label: 'Suggests', w: '150px', node: (r) => el('span', { className: 'pill' + (r.action === 'protect' ? ' ok' : ''),
      textContent: (r.action === 'ignore' ? 'clutter' : r.action) + (r.category ? ` → ${r.category}` : '') }) },
    { label: 'Emails', w: '70px', r: true, fmt: (r) => num(r.emails) },
    { label: 'Sure', w: '60px', r: true, fmt: (r) => `${Math.round((r.confidence || 0) * 100)}%` },
    { label: 'Why', w: 'minmax(200px,2fr)', key: 'reason', wrap: true },
    { label: '', w: '150px', r: true, node: (r) => el('div', { className: 'btns', style: 'justify-content:flex-end' }, [
      button('Reject', stop(() => decide(r, false)), 'sm'),
      button('Accept', stop(() => decide(r, true)), 'sm primary'),
    ]) },
  ], d.pending, { onClick: (r) => openSender(r.match_value),
    empty: 'No pending suggestions. Ask about more senders to get some.' }));
};

function pollLLM(status) {
  const tick = async () => {
    let st;
    try { st = await api('llm/status', {}); } catch (e) { toast(e.message, true); return; }
    if (status.isConnected) status.textContent = st.message || '';
    if (st.running) return setTimeout(tick, 1500);
    if (st.error) toast(st.error, true);
    S.overview = null;
    if (S.tab === 'assistant') go('assistant');
  };
  setTimeout(tick, 800);
}

function llmSettings(c) {
  const box = el('div', { className: 'stack-v' });
  let provider = c.provider;
  const draw = () => {
    box.textContent = '';
    const choice = (v, title, text) => el('button', { className: 'choice' + (provider === v ? ' on' : ''),
      onclick: () => { provider = v; draw(); } }, [el('b', { textContent: title }), el('span', { textContent: text })]);
    box.append(el('div', { className: 'choices' }, [
      choice('off', 'Off', 'No model is used.'),
      choice('ollama', 'On this computer', 'Ollama. Nothing leaves your machine.'),
      choice('anthropic', 'Claude', 'Anthropic’s API. Sender details are sent to it.'),
    ]));
    const share = el('input', { type: 'checkbox', checked: c.share_subjects });
    const fields = {};
    if (provider === 'ollama') {
      fields.host = el('input', { value: c.host });
      fields.model = el('input', { value: c.provider === 'ollama' ? c.model : c.defaults.ollama, list: 'ollama-models' });
      const dl = el('datalist', { id: 'ollama-models' });
      api('llm/models?host=' + encodeURIComponent(c.host)).then((r) => {
        r.models.forEach((m) => dl.append(el('option', { value: m })));
        hint.textContent = r.models.length ? `Installed: ${r.models.join(', ')}`
          : 'Ollama is not answering at that address. Install it from ollama.com, then pull a model (e.g. llama3.1).';
      }).catch(() => {});
      const hint = el('small');
      box.append(el('div', { className: 'row2' }, [
        el('label', { className: 'field' }, [el('span', { textContent: 'Ollama address' }), fields.host]),
        el('label', { className: 'field' }, [el('span', { textContent: 'Model' }), fields.model, dl]),
      ]), hint);
    }
    let consent;
    if (provider === 'anthropic') {
      fields.model = el('input', { value: c.provider === 'anthropic' ? c.model : c.defaults.anthropic });
      fields.key = el('input', { type: 'password', autocomplete: 'off',
        placeholder: c.has_key ? 'A key is stored — leave blank to keep it' : 'sk-ant-…' });
      consent = el('input', { type: 'checkbox', checked: c.provider === 'anthropic' });
      box.append(el('div', { className: 'row2' }, [
        el('label', { className: 'field' }, [el('span', { textContent: 'Model' }), fields.model]),
        el('label', { className: 'field' }, [el('span', { textContent: 'API key' }), fields.key,
          el('small', { textContent: 'Kept in your system keychain, never shown again.' })]),
      ]));
      box.append(el('label', { className: 'check' }, [consent, el('span', { textContent:
        'I understand sender addresses, message counts and read rates' +
        ' (and recent subject lines, if allowed below) are sent to Anthropic. Message bodies never are.' })]));
    }
    if (provider !== 'off') {
      box.append(el('label', { className: 'check' }, [share, el('span', { textContent:
        'Share up to five recent subject lines per sender — better suggestions, more shared' })]));
    }
    box.append(el('div', { className: 'btns' }, [button('Save', async () => {
      try {
        await api('settings/llm', { provider, model: fields.model?.value, host: fields.host?.value,
          api_key: fields.key?.value, share_subjects: share.checked, cloud_consent: consent?.checked });
        toast(provider === 'off' ? 'Assistant off.' : 'Assistant on. Open Assistant to ask for suggestions.',
              false, provider === 'off' ? null : { label: 'Open', run: () => go('assistant') });
        S.overview = null;
        await refreshHeader();
      } catch (e) { toast(e.message, true); }
    }, 'primary')]));
  };
  draw();
  return [box];
}

/* The classifier check: a random sample, corrected by hand, then scored. */
async function openEval() {
  const sheet = openSheet((s) => s.append(el('div', { className: 'body loading', textContent: 'Picking a sample…' })));
  let d;
  try { d = await api('eval/sample?n=30'); } catch (e) { return sheetError(sheet, e.message); }
  sheet.textContent = '';
  sheet.append(sheetTop('Classifier check', 'Correct what it got wrong',
    { sub: 'Thirty random messages. Change the category where it is wrong, and tick Important for ' +
           'anything you would not want cleaned up.' }));
  const rows = d.rows.map((r) => ({ ...r,
    sel: el('select', {}, d.categories.map((c) => el('option', { value: c, textContent: c, selected: c === r.category }))),
    imp: el('input', { type: 'checkbox', checked: !!r.protected }) }));
  const body = el('div', { className: 'body' });
  body.append(table([
    { label: 'Message', w: 'minmax(260px,1fr)', node: (r) => el('div', {}, [
      el('div', { className: 'mono', style: 'font-size:12px; color:var(--dim)', textContent: r.from_email }),
      el('div', { style: 'overflow:hidden; text-overflow:ellipsis', textContent: r.subject || '(no subject)' })]) },
    { label: 'Category', w: '150px', node: (r) => r.sel },
    { label: 'Important', w: '90px', c: true, node: (r) => r.imp },
  ], rows));
  const result = el('div', { style: 'margin-top:20px' });
  body.append(result);
  sheet.append(body);
  const scoreBtn = button('Score', async () => {
    try {
      const s = await api('eval/score', { rows: rows.map((r) => ({ msg_key: r.msg_key,
        true_category: r.sel.value, true_protected: r.imp.checked })) });
      result.textContent = '';
      result.append(el('div', { className: 'tiles', style: 'grid-template-columns:repeat(3,1fr)' }, [
        el('div', { className: 'tile' }, [el('div', { className: 'v num', style: `color:${s.missed_protection ? 'var(--bad)' : 'var(--green-d)'}`,
          textContent: num(s.missed_protection) }), el('div', { className: 'k', textContent: 'important but unprotected' })]),
        el('div', { className: 'tile' }, [el('div', { className: 'v num', textContent: `${Math.round(s.accuracy * 100)}%` }),
          el('div', { className: 'k', textContent: 'categories right' })]),
        el('div', { className: 'tile' }, [el('div', { className: 'v num', textContent: num(s.over_protection) }),
          el('div', { className: 'k', textContent: 'protected but not important' })]),
      ]));
      if (s.missed_examples.length) {
        result.append(el('p', { style: 'margin:16px 0 8px', textContent:
          'Protect these senders from their panel so this cannot happen:' }));
        result.append(el('div', { className: 'subjects' }, s.missed_examples.map((m) => el('div', { className: 's' }, [
          el('div', { className: 't', textContent: `${m.from_email} — ${m.subject}` }),
          el('div', { className: 'w', textContent: m.predicted })]))));
      }
      result.scrollIntoView({ behavior: 'smooth' });
    } catch (e) { toast(e.message, true); }
  }, 'primary');
  sheet.append(el('div', { className: 'foot' }, [el('span', { className: 'msg',
    textContent: 'Nothing is saved; this only measures.' }), button('Close', closeSheet, 'quiet'), scoreBtn]));
}

/* ---------- nav ---------- */
const NAV = [
  ['Mailbox', [['overview', 'Overview'], ['attention', 'Attention'], ['senders', 'Senders'], ['cleanup', 'Cleanup']]],
  ['Explore', [['domains', 'Domains'], ['categories', 'Categories'], ['ages', 'Age']]],
  ['Automate', [['rules', 'Rules'], ['unsubscribe', 'Unsubscribe'], ['assistant', 'Assistant']]],
  ['', [['history', 'History'], ['settings', 'Settings']]],
];

function drawNav() {
  const nav = $('#nav');
  const mob = $('#mobile-nav');
  nav.textContent = '';
  mob.textContent = '';
  if (S.needsSetup) return;
  // Only counts that ask for a decision; totals live on the pages themselves.
  const counts = { assistant: S.overview?.pending_suggestions };
  for (const [label, items] of NAV) {
    const g = el('div', { className: 'group' });
    if (label) g.append(el('div', { className: 'gl', textContent: label }));
    for (const [k, t] of items) {
      g.append(el('button', { className: S.tab === k ? 'on' : '', onclick: () => go(k) }, [
        el('span', { textContent: t }),
        counts[k] ? el('span', { className: 'count', textContent: num(counts[k]) }) : null,
      ]));
      mob.append(el('button', { className: S.tab === k ? 'on' : '', textContent: t, onclick: () => go(k) }));
    }
    nav.append(g);
  }
  const prot = S.overview ? S.overview.stats.protected : 0;
  nav.append(el('div', { className: 'note' }, [
    el('div', { className: 'row' }, [el('span', { className: 'swatch' }),
      el('span', { className: 'num', textContent: `${num(prot)} protected` })]),
    el('div', { textContent: 'Never touched by any action.' }),
  ]));
}

/* ---------- shell ---------- */
async function go(tab, opts = {}) {
  S.tab = tab;
  drawNav();
  const main = $('#main');
  if (S.needsSetup) {
    main.textContent = '';
    const logo = $('.brand .mark').cloneNode(true);
    logo.setAttribute('width', '72');
    logo.setAttribute('height', '72');
    main.append(el('div', { className: 'onboard' }, [
      logo,
      el('h1', { textContent: 'Welcome to mailcleaner' }),
      el('p', { textContent: 'See who fills your inbox, then clean it up safely. Connect Gmail, ' +
        'Outlook, Proton, Fastmail, iCloud, Yahoo, Zoho or any IMAP server to start.' }),
      button('Add a mailbox', () => openAddAccount(), 'primary big'),
      el('div', { className: 'facts' }, ['Runs on this computer', 'Reads headers only',
        'Never deletes'].map((t) => el('span', { textContent: t }))),
    ]));
    return;
  }
  if (!main.childElementCount) main.append(el('div', { className: 'loading', textContent: 'Loading…' }));
  const fresh = el('main', { id: 'main' });
  try {
    await VIEWS[tab](fresh);
  } catch (e) {
    fresh.textContent = '';
    fresh.append(el('p', { className: 'err', textContent: e.message }));
  }
  if (S.tab !== tab) return;               // the user moved on while this loaded
  $('#main').replaceWith(fresh);
  drawSelectionBar();
  if (opts.anchor) document.getElementById(opts.anchor)?.scrollIntoView({ block: 'start' });
  else if (!opts.keepScroll) window.scrollTo(0, 0);
  if (opts.focus === 'search') {
    const i = document.querySelector('.toolbar input');
    if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
}

function drawMode() {
  const m = $('#mode');
  m.className = 'mode' + (S.actions ? ' on' : '');
  m.querySelector('span').textContent = S.actions ? 'Actions on' : 'Read-only';
  m.hidden = S.needsSetup;
}
$('#mode').onclick = () => go('settings', { anchor: 'set-actions' });
$('.brand').onclick = (e) => { e.preventDefault(); if (!S.needsSetup) go('overview'); };

async function refreshHeader() {
  try {
    const d = await api('overview');
    S.overview = d.needs_setup ? null : d;
    S.needsSetup = !!d.needs_setup;
    S.actions = !!d.actions_enabled;
    if (!S.actions) S.selected.clear();
    drawAccounts(d.accounts || [], d.account_id);
    $('.syncbox').hidden = S.needsSetup;
    $('#ask').hidden = S.needsSetup;
    $('#synced').textContent = S.needsSetup ? '' : `Synced ${ago(d.last_sync)}`;
    $('#synced').title = S.needsSetup ? '' : `${num(d.stats.total)} messages · ${d.sync_days}-day window`;
    drawMode();
    drawNav();
  } catch (e) { toast(e.message, true); }
}

/* The switcher. Each mailbox gets a colour derived from its id so two accounts
   never look alike at a glance; switching is a server-side change of the active
   account, so every subsequent request reads that account's index. */
function hueFor(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}
function badge(a) {
  return el('span', { className: 'dot', style: `background: oklch(0.55 0.12 ${hueFor(a.id)})`,
    textContent: (a.label || a.email || '?').trim()[0] || '?' });
}
function caret() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'caret');
  svg.setAttribute('viewBox', '0 0 10 6');
  svg.setAttribute('width', '10');
  svg.setAttribute('height', '6');
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', 'M1 1l4 4 4-4');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'currentColor');
  path.setAttribute('stroke-width', '1.4');
  path.setAttribute('stroke-linecap', 'round');
  svg.append(path);
  return svg;
}

function drawAccounts(rows, activeId) {
  S.accounts = rows;
  S.activeAccount = activeId || '';
  const active = rows.find((a) => a.id === activeId);
  const btn = $('#acct-btn');
  btn.textContent = '';
  btn.append(active ? badge(active) : el('span', { className: 'dot', textContent: '+' }),
    el('span', { className: 'who', textContent: active ? active.label : 'Add a mailbox' }), caret());
  const menu = $('#acct-menu');
  menu.textContent = '';
  if (rows.length) menu.append(el('div', { className: 'eyebrow', textContent: 'Mailboxes' }));
  for (const a of rows) {
    menu.append(el('button', { className: 'mrow', role: 'menuitem', onclick: () => pickAccount(a) }, [
      badge(a),
      el('div', { className: 't' }, [
        el('div', { className: 'n', textContent: a.label }),
        el('div', { className: 's', textContent: (a.label === a.email ? a.provider : `${a.provider} · ${a.email}`) +
          (a.actions_enabled ? ' · actions on' : '') }),
      ]),
      el('span', { className: 'tick', textContent: a.id === activeId ? '✓' : '' }),
    ]));
  }
  if (rows.length) menu.append(el('div', { className: 'sep' }));
  menu.append(el('button', { className: 'mrow add', role: 'menuitem',
    onclick: () => { closeMenu(); openAddAccount(); } }, [
    el('span', { className: 'dot', textContent: '+' }),
    el('div', { className: 't' }, [el('div', { className: 'n', textContent: 'Add mailbox' }),
      el('div', { className: 's', textContent: 'Gmail, Outlook, Proton, IMAP…' })]),
  ]));
}

function openMenu() {
  $('#acct-menu').hidden = false;
  $('#acct-btn').setAttribute('aria-expanded', 'true');
  setTimeout(() => document.addEventListener('click', outsideMenu), 0);
  document.addEventListener('keydown', escMenu);
}
function closeMenu() {
  $('#acct-menu').hidden = true;
  $('#acct-btn').setAttribute('aria-expanded', 'false');
  document.removeEventListener('click', outsideMenu);
  document.removeEventListener('keydown', escMenu);
}
function outsideMenu(e) { if (!e.target.closest('.acct')) closeMenu(); }
function escMenu(e) { if (e.key === 'Escape') closeMenu(); }
$('#acct-btn').onclick = () => ($('#acct-menu').hidden ? openMenu() : closeMenu());

async function pickAccount(a) {
  closeMenu();
  if (a.id === S.activeAccount) return;
  try { await api('account/use', { id: a.id }); await reloadAll(); }
  catch (err) { toast(err.message, true); }
}

async function reloadAll(tab) {
  S.overview = null;
  S.selected.clear();
  await refreshHeader();
  await go(tab || S.tab);
}

/* ---------- connecting a mailbox ----------
   Two shapes: providers with an app password take one, and providers without
   one (Outlook) hand the browser a device code to enter on their own site. */
async function openAddAccount(preselect) {
  let providers = [];
  const sheet = openSheet((x) => x.append(el('div', { className: 'body loading', textContent: 'Loading providers…' })));
  try { providers = (await api('providers')).rows; }
  catch (e) { return sheetError(sheet, e.message); }

  function chooser() {
    sheet.textContent = '';
    sheet.append(sheetTop('Add a mailbox', 'Which service is it?',
      { sub: 'Each mailbox is indexed separately — its own rules, history and settings.' }));
    sheet.append(el('div', { className: 'body' }, el('div', { className: 'plist' }, providers.map((p) =>
      el('button', { onclick: () => form(p) }, [
        el('div', { className: 'pn', textContent: p.name }),
        el('div', { className: 'pd', textContent: p.uses_oauth ? 'Signs in through your browser' : 'Uses an app password' }),
      ])))));
  }

  function form(p) {
    sheet.textContent = '';
    sheet.append(sheetTop('Add a mailbox', p.name, { sub: p.uses_oauth
      ? 'You will finish signing in on the provider’s own site.'
      : 'The password goes straight to your system keychain.' }));
    const email = el('input', { type: 'email', placeholder: 'you@example.com', autocomplete: 'username' });
    const label = el('input', { type: 'text', placeholder: 'Optional, e.g. Work' });
    const pass = el('input', { type: 'password', autocomplete: 'off', placeholder: 'App password' });
    const host = el('input', { type: 'text', value: p.host || '' });
    const port = el('input', { type: 'number', value: String(p.port) });
    const sec = el('select', {}, ['ssl', 'starttls', 'none'].map((v) =>
      el('option', { value: v, selected: v === p.security, textContent: v })));
    const f = (lbl, input) => el('label', {}, [el('span', { className: 'fl', textContent: lbl }), input]);
    const fields = el('div', { className: 'form' }, [
      el('div', { className: 'row2' }, [f('Email address', email), f('Name for this mailbox', label)])]);
    if (p.ask_host) {
      fields.append(el('div', { className: 'row2' }, [f('IMAP host', host), f('Port', port)]));
      fields.append(f('Connection security', sec));
    }
    if (!p.uses_oauth) fields.append(f('App password', pass));
    sheet.append(el('div', { className: 'body' }, [
      el('h3', { textContent: 'Before you start' }), linkify(p.help),
      el('h3', { textContent: 'Mailbox' }), fields,
    ]));
    const msg = el('span', { className: 'msg' });
    const submit = button(p.uses_oauth ? 'Start sign-in' : 'Connect', async () => {
      const body = { provider: p.key, email: email.value.trim(), label: label.value.trim(),
                     host: host.value.trim(), port: port.value, security: sec.value };
      submit.disabled = true;
      msg.textContent = p.uses_oauth ? 'Asking for a code…' : 'Connecting…';
      msg.className = 'msg';
      try {
        if (p.uses_oauth) device(p, await api('account/oauth/start', body), false);
        else await connected(await api('account/add', { ...body, password: pass.value }));
      } catch (e) {
        msg.textContent = e.message;
        msg.className = 'msg err';
        submit.disabled = false;
      }
    }, 'primary');
    sheet.append(el('div', { className: 'foot' }, [msg, button('Back', chooser, 'quiet'), submit]));
    email.focus();
  }

  async function connected(r) {
    closeSheet();
    toast(`Connected ${r.label}. Fetching its headers now…`);
    await reloadAll('overview');
    startSync(false);
  }

  const chosen = preselect && providers.find((p) => p.key === preselect);
  if (chosen) form(chosen); else chooser();
}

/* Device-code sign-in: show the code, then poll until the provider says the
   user finished (or gave up). Used both to add a mailbox and to sign in again. */
function device(p, state, reauth) {
  const sheet = $('.sheet') || openSheet(() => {});
  sheet.textContent = '';
  sheet.append(sheetTop(reauth ? 'Sign in again' : 'Add a mailbox', p.name || 'Outlook',
    { sub: 'Finish signing in, then come back to this tab.' }));
  const msg = el('span', { className: 'msg', textContent: state.message || '' });
  sheet.append(el('div', { className: 'body' }, [
    el('h3', { textContent: 'Step 1 — open the sign-in page' }),
    el('p', {}, el('a', { href: state.url, target: '_blank', rel: 'noreferrer', textContent: state.url })),
    el('h3', { textContent: 'Step 2 — enter this code' }),
    el('div', { className: 'devcode', textContent: state.code }),
    el('p', { className: 'dim', textContent: `Sign in as ${state.email}. This page notices when you are done.` }),
  ]));
  sheet.append(el('div', { className: 'foot' }, [msg, button('Close', closeSheet, 'quiet')]));
  const tick = async () => {
    if (!$('#scrim')) return;
    let st;
    try { st = await api('account/oauth/status', {}); }
    catch (e) { msg.textContent = e.message; msg.className = 'msg err'; return; }
    if (st.running) { msg.textContent = st.message || 'Waiting…'; return setTimeout(tick, 2000); }
    if (st.error) { msg.textContent = st.error; msg.className = 'msg err'; return; }
    if (st.account) {
      closeSheet();
      toast(st.message || 'Signed in.');
      if (reauth) await refreshHeader();
      else { await reloadAll('overview'); startSync(false); }
    }
  };
  setTimeout(tick, 2000);
}

async function reauthOAuth(a) {
  openSheet((s) => s.append(el('div', { className: 'body loading', textContent: 'Asking for a code…' })));
  try { device({ name: a.provider_name }, await api('settings/oauth', {}), true); }
  catch (e) { sheetError($('.sheet'), e.message); }
}

/* The setup steps arrive as plain text with bare URLs in them. */
function linkify(text) {
  const out = el('div', { className: 'steps' });
  for (const part of String(text || '').split(/(https?:\/\/\S+)/g)) {
    if (/^https?:\/\//.test(part)) out.append(el('a', { href: part, target: '_blank', rel: 'noreferrer', textContent: part }));
    else if (part) out.append(document.createTextNode(part));
  }
  return out;
}

/* ---------- sync ---------- */
async function startSync(full) {
  const btn = $('#btn-sync');
  btn.disabled = true;
  btn.textContent = 'Syncing…';
  try { await api('sync', { full }); pollSync(); }
  catch (e) { toast(e.message, true); btn.disabled = false; btn.textContent = 'Sync'; }
}
function pollSync() {
  const btn = $('#btn-sync');
  const tick = async () => {
    let s;
    try { s = await api('sync/status', {}); } catch (e) { toast(e.message, true); return; }
    if (s.message) $('#synced').textContent = s.message;
    if (s.running) return setTimeout(tick, 700);
    if (s.error) toast(s.error, true, { label: 'Check connection', run: () => go('settings', { anchor: 'set-mailbox' }) });
    btn.disabled = false;
    btn.textContent = 'Sync';
    S.overview = null;
    await refreshHeader();
    go(S.tab, { keepScroll: true });
  };
  tick();
}
$('#btn-sync').onclick = () => startSync(false);

/* ---------- plain-English search ---------- */
$('#ask').onsubmit = async (e) => {
  e.preventDefault();
  const input = $('#ask input');
  const text = input.value.trim();
  if (!text) return;
  if (S.overview && S.overview.llm_provider === 'off') {
    return toast('Describing mail in plain English uses the assistant, which is off.', false,
                 { label: 'Set it up', run: () => go('settings', { anchor: 'set-llm' }) });
  }
  input.disabled = true;
  try {
    const r = await api('ask', { text });
    openPreview({ kind: 'filter', value: r.filter }, 'archive', {
      note: `Understood as: ${r.summary}.` + (r.explanation ? ` ${r.explanation}` : ''),
      saveFilter: r.filter,
    });
  } catch (err) { toast(err.message, true); }
  finally { input.disabled = false; }
};

refreshHeader().then(() => go('overview'));
</script>
