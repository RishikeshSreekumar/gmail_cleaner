name: Release

# Cutting a release:  git tag v0.1.0 && git push origin v0.1.0
#
# Builds the wheel and a standalone `mclean` for every supported platform,
# then publishes them all on the GitHub release so people can install without
# a Python toolchain.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  binaries:
    name: mclean (${{ matrix.os_name }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            os_name: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            os_name: linux
            arch: arm64
          - runner: macos-15-intel
            os_name: macos
            arch: x86_64
          - runner: macos-14
            os_name: macos
            arch: arm64
          - runner: windows-latest
            os_name: windows
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
      - name: Build binary
        working-directory: packaging
        run: pyinstaller --clean --noconfirm mclean.spec
      - name: Check it runs
        working-directory: packaging
        shell: bash
        run: ./dist/mclean providers

      # Older glibc than the build host would reject the binary, so the Linux
      # builds run on the oldest supported runner rather than being patched.
      - name: Package (unix)
        if: matrix.os_name != 'windows'
        shell: bash
        run: |
          tar -czf "mclean-${TAG}-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz" -C packaging/dist mclean
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Package (windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          7z a "mclean-${TAG}-windows-${{ matrix.arch }}.zip" ./packaging/dist/mclean.exe
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.zip

  release:
    name: Publish release
    needs: [package, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' \) \
            -exec cp {} release/ \;
          cd release && sha256sum * > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          sed -e "s/{TAG}/$TAG/g" -e "s/{VERSION}/${TAG#v}/g" .github/release-notes.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release/* \
              --title "$TAG" --notes-file notes.md --generate-notes
          fi
