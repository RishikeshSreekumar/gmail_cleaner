name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Smoke tests (TUI, actions, account switching)
        run: python tests/test_smoke.py
      - name: Web tests (HTTP surface and guards)
        run: python tests/test_web.py
      - name: Provider tests (folders, MOVE guard, migration)
        run: python tests/test_providers.py

  no-permanent-delete:
    name: No permanent delete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject delete primitives in executable code
        run: python .github/scripts/check_no_delete.py
